<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pragathi Alumni</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body { background:#080f1e; color:white; font-family:sans-serif; }
.section { display:none; }
.section.active { display:block; }
.nav-btn { cursor:pointer; padding:8px 16px; }
.nav-btn.active { color:#c9982a; }
.card { background:#111827; padding:16px; border-radius:12px; }
</style>
</head>

<body>

<!-- NAV -->
<div class="flex justify-between p-4 bg-black">
  <h1 class="font-bold">Pragathi Alumni</h1>
  <div class="flex gap-4">
    <span class="nav-btn active" onclick="navigate('home')">Home</span>
    <span class="nav-btn" onclick="navigate('directory')">Directory</span>
    <span class="nav-btn" onclick="navigate('register')">Register</span>
  </div>
</div>

<!-- HOME -->
<section id="home" class="section active text-center p-10">
  <h2 class="text-4xl font-bold">Welcome Back, Champs</h2>
</section>

<!-- DIRECTORY -->
<section id="directory" class="section p-6">
  <h2 class="text-2xl mb-4">Alumni Directory</h2>
  <div id="alumniGrid" class="grid md:grid-cols-3 gap-4"></div>
</section>

<!-- REGISTER -->
<section id="register" class="section p-6">
  <h2 class="text-2xl mb-4">Register</h2>

  <form id="regForm" class="space-y-3 max-w-md">
    <input class="w-full p-2 text-black" placeholder="Name" required>
    <input class="w-full p-2 text-black" placeholder="Email" required>
    <input class="w-full p-2 text-black" placeholder="Batch" required>
    <input class="w-full p-2 text-black" placeholder="Role">
    <input class="w-full p-2 text-black" placeholder="Location">
    <textarea class="w-full p-2 text-black" placeholder="Message"></textarea>

    <button class="bg-yellow-500 px-4 py-2 rounded">Submit</button>
  </form>
</section>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyALHYLUPn7gZ-5noOG5EeuHa6DZXtrStkM",
  authDomain: "pragathi-alumni.firebaseapp.com",
  projectId: "pragathi-alumni"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.addEventListener("DOMContentLoaded", () => {

  const form = document.getElementById("regForm");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const inputs = form.querySelectorAll("input, textarea");

    await addDoc(collection(db, "alumni"), {
      name: inputs[0].value,
      email: inputs[1].value,
      batch: inputs[2].value,
      role: inputs[3].value,
      location: inputs[4].value,
      message: inputs[5].value,
      createdAt: new Date()
    });

    alert("✅ Registered!");
    form.reset();

    loadAlumni();
    navigate("directory");
  });

  loadAlumni();
});

async function loadAlumni() {
  const snapshot = await getDocs(collection(db, "alumni"));
  const grid = document.getElementById("alumniGrid");

  grid.innerHTML = "";

  snapshot.forEach((doc) => {
    const a = doc.data();

    grid.innerHTML += `
      <div class="card">
        <h3 class="font-bold text-lg">${a.name}</h3>
        <p>${a.role || ""}</p>
        <p>${a.email}</p>
        <p class="text-sm text-gray-400">Batch ${a.batch}</p>
      </div>
    `;
  });
}

// NAVIGATION
window.navigate = function(id) {
  document.querySelectorAll(".section").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");

  document.querySelectorAll(".nav-btn").forEach(btn => btn.classList.remove("active"));
};
</script>

</body>
</html>
