<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pragathi Alumni</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body {
  background: #010101;
  color: white;
  font-family: sans-serif;
}

.glass {
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.1);
}

.gradient-text {
  background: linear-gradient(135deg,#FA93FA,#C967E8,#983AD6);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
</style>
</head>

<body>

<!-- HERO -->
<section class="text-center py-24 px-6">
  
  <div class="inline-flex items-center gap-2 px-4 py-2 rounded-full glass mb-6">
    <span class="text-sm text-white/70">Used by founders. Loved by devs.</span>
  </div>

  <h1 class="text-4xl md:text-6xl font-bold leading-tight">
    <span class="gradient-text">Your Vision</span><br>
    <span class="gradient-text">Our Digital Reality.</span>
  </h1>

  <p class="mt-6 text-white/70 max-w-xl mx-auto">
    Reconnect with Pragathi alumni, share memories, and grow your network.
  </p>

  <button onclick="navigate('register')" 
    class="mt-8 px-6 py-3 bg-white text-black rounded-full font-semibold">
    Join Now
  </button>

</section>

<!-- NAV -->
<div class="flex justify-center gap-6 mb-10 text-white/70">
  <button onclick="navigate('home')">Home</button>
  <button onclick="navigate('directory')">Directory</button>
  <button onclick="navigate('register')">Register</button>
</div>

<!-- DIRECTORY -->
<section id="directory" class="hidden px-6 max-w-6xl mx-auto">
  <h2 class="text-2xl mb-6">Alumni Directory</h2>
  <div id="alumniGrid" class="grid md:grid-cols-3 gap-6"></div>
</section>

<!-- REGISTER -->
<section id="register" class="hidden px-6 max-w-xl mx-auto">

  <div class="glass p-6 rounded-2xl">
    <h2 class="text-2xl mb-4">Join Alumni</h2>

    <form id="regForm" class="space-y-3">
      <input class="w-full p-3 rounded bg-black/40 border border-white/10" placeholder="Name" required>
      <input class="w-full p-3 rounded bg-black/40 border border-white/10" placeholder="Email" required>
      <input class="w-full p-3 rounded bg-black/40 border border-white/10" placeholder="Batch" required>
      <input class="w-full p-3 rounded bg-black/40 border border-white/10" placeholder="Role">
      <input class="w-full p-3 rounded bg-black/40 border border-white/10" placeholder="Location">
      <textarea class="w-full p-3 rounded bg-black/40 border border-white/10" placeholder="Message"></textarea>

      <button class="w-full py-3 rounded-full bg-gradient-to-r from-[#FA93FA] via-[#C967E8] to-[#983AD6]">
        Submit
      </button>
    </form>
  </div>

</section>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyALHYLUPn7gZ-5noOG5EeuHa6DZXtrStkM",
  authDomain: "pragathi-alumni.firebaseapp.com",
  projectId: "pragathi-alumni"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.addEventListener("DOMContentLoaded", () => {

  const form = document.getElementById("regForm");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const inputs = form.querySelectorAll("input, textarea");

    await addDoc(collection(db, "alumni"), {
      name: inputs[0].value,
      email: inputs[1].value,
      batch: inputs[2].value,
      role: inputs[3].value,
      location: inputs[4].value,
      message: inputs[5].value,
      createdAt: new Date()
    });

    alert("✅ Registered!");
    form.reset();

    loadAlumni();
    navigate("directory");
  });

  loadAlumni();
});

async function loadAlumni() {
  const snapshot = await getDocs(collection(db, "alumni"));
  const grid = document.getElementById("alumniGrid");

  grid.innerHTML = "";

  snapshot.forEach((doc) => {
    const a = doc.data();

    grid.innerHTML += `
      <div class="glass p-4 rounded-xl">
        <h3 class="font-bold text-lg">${a.name}</h3>
        <p class="text-white/60">${a.role || ""}</p>
        <p class="text-sm">${a.email}</p>
        <p class="text-xs text-white/40">Batch ${a.batch}</p>
      </div>
    `;
  });
}

// NAV
window.navigate = function(id) {
  document.getElementById("directory").classList.add("hidden");
  document.getElementById("register").classList.add("hidden");

  if (id !== "home") {
    document.getElementById(id).classList.remove("hidden");
  }
};
</script>

</body>
</html>
